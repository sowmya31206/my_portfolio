<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Portfolio</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(to right,#4facfe,#00f2fe);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:white;
    width:420px;
    padding:30px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 8px 20px rgba(0,0,0,0.3);
}

h1{
    color:#0077cc;
    margin-bottom:20px;
}

img{
    width:200px;
    height:200px;
    border-radius:15px;
    object-fit:cover;
    object-position:center 25%;
    border:4px solid #0077cc;
  
}

h2{
    color:#333;
}

h3{
    color:gray;
    margin-top:10px;
}

button{
    margin-top:30px;
    padding:12px 30px;
    background:#0077cc;
    color:white;
    border:none;
    border-radius:30px;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#005fa3;
    transform:scale(1.05);
}

.footer{
    margin-top:25px;
    color:#666;
    font-size:14px;
}
</style>

</head>

<body>

<div class="container">

<h1>Welcome To My Portfolio</h1>

<img src="profile.jpg.jpeg" alt="Profile Photo">

<h2>Sowmya Shanmugavel</h2>

<h3>Computer Science Engineering Student</h3>

<a href="details.html">
<button>For More Information</button>
</a>

<div class="footer">
<p>© 2026 | My Portfolio</p>
</div>

</div>

</body>
</html>
